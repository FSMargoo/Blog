# 博客全局配置
site_name: "M. Argoo Research Blog"
site_subtitle: "A living archive of research on human-computer interaction."
author: "M. Argoo"
description: "A static blog generator that makes every post look like a published paper."
base_url: ""
language: "zh-CN"

# 期刊风设置
journal:
  name: "M. Argoo Research Blog"
  issn: "XXXX-XXXX"
  volume_prefix: "Vol."
  issue_prefix: "No."
  
# 输出目录
output_dir: "public"
content_dir: "content"
template_dir: "templates"
static_dir: "static"

# 每页文章数
posts_per_page: 10

# 日期格式
date_format: "%Y-%m-%d"

# 数学公式支持 (katex)
katex:
  enabled: true
  css: "https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
  js: "https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
  auto_render: "https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"

# 自定义数学宏，会在构建阶段展开；也可以在单篇文章 frontmatter 中定义。
latex_macros: {}
