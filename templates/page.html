{% extends "base.html" %}

{% block title %}{{ page.title }} | {{ config.site_name }}{% endblock %}
{% block body_class %}static-page{% endblock %}

{% block content %}
<div class="article-detail">
  <header class="article-header">
    <h1 class="article-title">{{ page.title }}</h1>
  </header>
  <div class="article-body">
    {{ page.body | safe }}
  </div>
</div>
{% endblock %}
